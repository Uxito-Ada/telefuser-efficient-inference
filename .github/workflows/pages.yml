name: Publish Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site renderer
        run: python -m pip install --disable-pip-version-check markdown
      - name: Validate generated site
        run: |
          python scripts/build_blog.py
          python scripts/build_site.py
          python scripts/validate_repo.py
      - name: Stage and verify media assets
        run: |
          mkdir -p site/assets
          find sections -type f \
            \( -iname '*.mp4' -o -iname '*.svg' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) \
            -exec cp -f {} site/assets/ \;
          test -s site/assets/smoothing-performance.svg
          test -s site/assets/turbo-telefuser.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
