name: Validate blog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate section contracts and links
        run: python scripts/validate_repo.py
      - name: Check generated article
        run: |
          python scripts/build_blog.py
          git diff --exit-code -- BLOG.md
