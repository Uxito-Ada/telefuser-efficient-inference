<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">TeleFuser MiniMax-H3 execution overview</title>
  <desc id="desc">A four-stage path from adapter-aware weights through FP8 linear and FP8 Sol attention to multi-GPU output.</desc>
  <rect width="1200" height="430" fill="#ffffff"/>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #17212b; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #5b6670; }
    .step { font: 700 13px Arial, sans-serif; fill: #ffffff; }
    .head { font: 700 20px Arial, sans-serif; fill: #17212b; }
    .body { font: 400 15px Arial, sans-serif; fill: #46515b; }
    .arrow { stroke: #8b969f; stroke-width: 2; fill: none; }
  </style>
  <text class="title" x="64" y="62">One execution path, four coordinated decisions</text>
  <text class="subtitle" x="64" y="94">MiniMax-H3 on NVIDIA H100</text>

  <rect x="64" y="142" width="232" height="196" rx="6" fill="#f7faf9" stroke="#2b8a78" stroke-width="2"/>
  <rect x="80" y="160" width="62" height="26" rx="4" fill="#2b8a78"/>
  <text class="step" x="111" y="178" text-anchor="middle">STAGE 1</text>
  <text class="head" x="80" y="222">Prepare weights</text>
  <text class="body" x="80" y="254">Merge adapter first</text>
  <text class="body" x="80" y="279">Build device-local cache</text>
  <text class="body" x="80" y="304">Release stale copies</text>

  <path class="arrow" d="M306 240 H336"/>
  <path d="M336 234 L346 240 L336 246 Z" fill="#8b969f"/>

  <rect x="346" y="142" width="232" height="196" rx="6" fill="#fbfaf6" stroke="#d39a2c" stroke-width="2"/>
  <rect x="362" y="160" width="62" height="26" rx="4" fill="#d39a2c"/>
  <text class="step" x="393" y="178" text-anchor="middle">STAGE 2</text>
  <text class="head" x="362" y="222">FP8 transformer</text>
  <text class="body" x="362" y="254">Cached FP8 weights</text>
  <text class="body" x="362" y="279">Dynamic activations</text>
  <text class="body" x="362" y="304">Linear + MLP coverage</text>

  <path class="arrow" d="M588 240 H618"/>
  <path d="M618 234 L628 240 L618 246 Z" fill="#8b969f"/>

  <rect x="628" y="142" width="232" height="196" rx="6" fill="#fbf7f7" stroke="#cf665b" stroke-width="2"/>
  <rect x="644" y="160" width="62" height="26" rx="4" fill="#cf665b"/>
  <text class="step" x="675" y="178" text-anchor="middle">STAGE 3</text>
  <text class="head" x="644" y="222">FP8 Sol-Attn</text>
  <text class="body" x="644" y="254">Shared QKV preparation</text>
  <text class="body" x="644" y="279">On-chip sparse routing</text>
  <text class="body" x="644" y="304">SM90 QK / PV compute</text>

  <path class="arrow" d="M870 240 H900"/>
  <path d="M900 234 L910 240 L900 246 Z" fill="#8b969f"/>

  <rect x="910" y="142" width="226" height="196" rx="6" fill="#f7f8fb" stroke="#4c6fa8" stroke-width="2"/>
  <rect x="926" y="160" width="62" height="26" rx="4" fill="#4c6fa8"/>
  <text class="step" x="957" y="178" text-anchor="middle">STAGE 4</text>
  <text class="head" x="926" y="222">Scale and correct</text>
  <text class="body" x="926" y="254">Attention smoothing</text>
  <text class="body" x="926" y="279">Ulysses + tensor parallel</text>
  <text class="body" x="926" y="304">Video + audio output</text>

  <line x1="64" y1="380" x2="1136" y2="380" stroke="#dce2e6"/>
  <text class="subtitle" x="600" y="410" text-anchor="middle">Quantization, sparsity, quality, and distribution share one tensor contract</text>
</svg>
