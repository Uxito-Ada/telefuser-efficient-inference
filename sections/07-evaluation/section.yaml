id: 07-evaluation
title: Evaluating the Complete System
status: protocol-defined
incoming_premise: All method components now participate in one SP4 execution graph.
outgoing_question: Which conclusions generalize beyond the measured contract?
evidence:
  - experiments/h100-sp4-e2e/raw/summary.json
  - experiments/quality-suite/raw/summary.json
primary_baseline: FastVideo FastH3 Dense/Data-Free BF16 + FA4 on 4xH100
candidate_references:
  - FastVideo VSA on its maintained H100 path
  - MiniMax-H3 official Diffusers quality output
  - LightX2V Sol only after valid official-example output
forbidden_claims:
  - speedup against an internal TeleFuser baseline as the headline
  - cross-GPU-count headline comparisons
  - performance from invalid media
  - B200 numbers projected onto H100
  - perceptual equivalence from paired pixel metrics alone
